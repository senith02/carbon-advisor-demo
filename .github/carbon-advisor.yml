# Team config for the GB-scenario advisory job (research DL-033 R3-C6, R3-K).
# This repository runs on GitHub-hosted runners, which are NOT known to be in
# Great Britain. GB is declared here only for the job that runs in labelled
# scenario mode (scenario: gb-hypothetical); every output of it says SCENARIO.
compute_region: GB
enabled_workflows: [ci.yml]
urgent_markers: ["[urgent]"]
veto_events: [workflow_dispatch, schedule]
max_delay_hours: 24
cold_start_run_now: true
history_cap: 500
show_live_intensity: true
redispatch: "off"
