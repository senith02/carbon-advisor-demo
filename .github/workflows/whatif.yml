# Repo What-If Report for this repository (research DL-033 R3-I; DL-037 §7; DL-038 §5).
#
# Replays this repository's completed runs of one workflow through the advisor and
# shows what it would have recommended on GB compute (labelled SCENARIO). The report
# appears in this run's Summary and is uploaded as a workflow artifact
# (report.html, report.md, report.json). Demonstration only, never research evidence.
name: carbon-whatif

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Workflow file to replay (e.g. ci.yml)
        required: true
        default: ci.yml

permissions:
  actions: read

jobs:
  whatif:
    runs-on: ubuntu-24.04
    steps:
      - uses: senith02/Artifact/Research_Artifact/code/github-action@3ce965086a889e0b35d74c77f0903512f1e60bbe
        with:
          mode: whatif
          workflow: ${{ inputs.workflow }}
