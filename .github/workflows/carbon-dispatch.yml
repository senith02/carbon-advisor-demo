# Re-dispatch of deferred ci.yml runs (research P4-T4; DL-033 R3-C10; DL-038 §6, §11).
#
# It dispatches each open carbon-deferral issue whose start time has passed, then
# comments on it and closes it. A failed dispatch stays open for the next pass, and
# closing an issue by hand cancels the deferral.
#
# What starts it:
#   - workflow_dispatch: the punctual path. The author's server runs carbon_tick.py
#     (Research_Artifact/code/github-action/examples/vps-trigger/), which sleeps until
#     the exact start time and then starts this workflow.
#   - schedule: a 6-hourly BACKUP only. GitHub's schedule is best-effort (on
#     2026-10-21/22 an hourly schedule ran 3 times in 12 hours).
name: carbon-dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: carbon-dispatch
  cancel-in-progress: false

permissions:
  actions: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: senith02/Artifact/Research_Artifact/code/github-action@3ce965086a889e0b35d74c77f0903512f1e60bbe
        with:
          mode: dispatch
