# CI for the carbon-advisor demo (research P4-T4; DL-038).
#
# ONE advisory job, no config file, no checkout:
#   - the real answer: this GitHub-hosted runner is declared GITHUB-HOSTED (not GB),
#     so the advisor answers RUN NOW (fail-safe: region_not_gb);
#   - show-gb-scenario adds, in the same summary, what it would recommend on GB
#     compute, labelled SCENARIO;
#   - redispatch: scenario-demo records that SCENARIO deferral as a carbon-deferral
#     issue, so this demo can show the full cycle. The build is then skipped, and
#     carbon-dispatch.yml re-runs it at the recommended hour. Demo repositories only.
# The build runs a SYNTHETIC ~9-minute workload (scripts/synthetic_workload.py).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      carbon_redispatch_sha:
        description: Set by the carbon advisor's dispatcher; leave empty for a manual run
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  carbon-advisor:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    outputs:
      deferred: ${{ steps.advisor.outputs.deferred }}
      build_sha: ${{ steps.advisor.outputs.build_sha }}
    steps:
      - id: advisor
        uses: senith02/Artifact/Research_Artifact/code/github-action@3ce965086a889e0b35d74c77f0903512f1e60bbe
        with:
          compute-region: GITHUB-HOSTED
          show-gb-scenario: true
          redispatch: scenario-demo

  build:
    needs: carbon-advisor
    if: ${{ !cancelled() && needs.carbon-advisor.outputs.deferred != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.carbon-advisor.outputs.build_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Synthetic workload (stands in for a longer test suite)
        run: python -m scripts.synthetic_workload --seconds 540
